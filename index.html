<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>To-Do App</h1>

        <div class="input-box">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task..."
            >

            <button id="addBtn">
                Add
            </button>

        </div>

        <div class="task-info">

            <p>
                Total Tasks:
                <span id="taskCount">0</span>
            </p>

            <button id="clearBtn">
                Clear Completed
            </button>

        </div>

        <ul id="taskList">

            <!-- Tasks will appear here -->

        </ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
